<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preview Beranda warga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#FFFFFF;--card:#FFFFFF;--card2:#E9EDEA;--text:#101614;--mut:rgba(16,22,20,.6);--g:#0A8F44;--gh:#0A8F44;--line:rgba(0,0,0,.09);--ok:rgba(10,143,68,.14);--rs:12px;--r:20px;--rm:999px;--ia:18%;--icp:72%;--mixk:#000;--gd:#CDEBD8;--gm:#0B6B34;--sh:0 1px 2px rgba(16,22,20,.04),0 4px 12px rgba(16,22,20,.04);
--hero:radial-gradient(110% 100% at 100% 0%,rgba(255,255,255,.28),transparent 55%),linear-gradient(145deg,#22B863 0%,#0F9D4E 55%,#0B8442 100%);--hero-mut:rgba(255,255,255,.9);--hero-dot:rgba(255,255,255,.1);
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-mode="dark"]{--ia:24%;--icp:62%;--mixk:#fff;--gd:#12392A;--gm:#D5F7E1;--sh:0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.03);--bg:#111314;--card:#1A1D1F;--card2:#25292C;--text:#fff;--mut:rgba(255,255,255,.62);--g:#10A24F;--gh:#3DDC84;--line:rgba(255,255,255,.1);--ok:rgba(61,220,132,.22);
--hero:radial-gradient(120% 110% at 100% 0%,rgba(61,220,132,.26),transparent 55%),linear-gradient(150deg,#134230 0%,#0D211A 55%,#14181A 100%);--hero-mut:rgba(255,255,255,.75);--hero-dot:rgba(255,255,255,.04);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:500 15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--gh);outline-offset:2px}
.lucide{width:22px;height:22px;flex:none}
.kop{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:center}
.logo{width:60px;height:60px;border-radius:var(--rm);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);display:grid;place-items:center}
.logo .lucide{width:26px;height:26px}
.kop small{display:block;font-size:13px;font-weight:500;color:var(--mut);line-height:1.35}
.kop h1{font-size:22px;font-weight:800;line-height:1.2;margin:0 0 4px;color:var(--text);letter-spacing:-.01em}
.rule{height:1px;background:var(--line);margin:16px 0 18px}
.stack{display:grid;gap:12px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:var(--r);padding:20px}
.hero::after{content:"";position:absolute;right:-50px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:var(--hero-dot)}
.hero>*{position:relative;z-index:1}
.hero .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero .lab{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--hero-mut)}
.hero .lab .lucide{width:18px;height:18px}
.hero .date{font-size:12px;font-weight:600;padding:5px 12px;border-radius:var(--rm);background:rgba(255,255,255,.2)}
.hero h2{font-size:17px;font-weight:700;line-height:1.35;margin:12px 0 4px;color:#fff}
.hero p{margin:0;color:var(--hero-mut);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:4px;background:#fff;color:#0B6B34;font-size:15px;font-weight:700;border-radius:var(--rm);min-height:44px;padding:0 18px;margin-top:14px}
.btn .lucide{width:18px;height:18px}
.card{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card .t{flex:1;min-width:0}
.card .l{display:block;font-size:13px;font-weight:600;color:var(--mut)}
.card b{display:block;font-size:17px;font-weight:800;margin:2px 0}
.card .s{font-size:13px;color:var(--mut)}
.card .go{color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.tile .ico,.help .ico{width:44px;height:44px;border-radius:var(--rm);background:color-mix(in srgb,var(--c) var(--ia),transparent);color:color-mix(in srgb,var(--c) var(--icp),var(--mixk));display:grid;place-items:center;flex:none}
.tile .ico{margin-bottom:8px}
.h-green{--c:#10B981}.h-amber{--c:#F59E0B}.h-blue{--c:#3B82F6}.h-pink{--c:#EC4899}.h-cyan{--c:#06B6D4}.h-purple{--c:#A855F7}.h-indigo{--c:#6366F1}.h-teal{--c:#14B8A6}.h-wa{--c:#22C55E}
.tile b{font-size:15px;font-weight:700;line-height:1.3}
.tile .s{font-size:13px;color:var(--mut);line-height:1.35}
.tile .amt{font-size:15px;font-weight:800}
.new{position:absolute;top:28px;right:52px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--rm);background:var(--ok)}
.help b{font-size:15px;font-weight:700;margin:0}
.tile .go{position:absolute;top:26px;right:16px;width:28px;height:28px;border-radius:var(--rm);display:grid;place-items:center;background:color-mix(in srgb,var(--c) var(--ia),transparent);color:color-mix(in srgb,var(--c) var(--icp),var(--mixk))}
.tile .go .lucide{width:16px;height:16px}
button.card:active,button.tile:active{transform:scale(.98)}
@media(prefers-reduced-motion:no-preference){.card,.tile{transition:transform .1s}}
nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:0;background:var(--bg);display:flex;padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text);padding:0;text-align:center}
nav button.on{font-weight:700}
nav .ni{width:60px;height:30px;border-radius:var(--rm);display:grid;place-items:center}
nav button.on .ni{background:var(--gd);color:var(--gm)}
nav .lucide{width:20px;height:20px}
</style>
</head>
<body>
<main>
  <header>
    <div class="kop">
      <div class="logo" aria-label="Logo desa"><i data-lucide="landmark"></i></div>
      <div>
        <h1>Rukun Warga 002</h1>
        <small>Perum. Pesona Gading Cibitung 2</small>
      </div>
      <div class="logo" aria-label="Logo kepengurusan"><i data-lucide="handshake"></i></div>
    </div>
    <div class="rule"></div>
  </header>

  <div class="stack">
    <section class="hero">
      <div class="top"><span class="lab"><i data-lucide="megaphone"></i>Pengumuman terbaru</span><span class="date">3 Oktober</span></div>
      <h2>Kerja bakti membersihkan selokan</h2>
      <p>Hari Minggu, 12 Oktober pukul 07.00. Semua warga diharapkan hadir dan membawa alat kebersihan.</p>
      <button class="btn">Lihat detail<i data-lucide="chevron-right"></i></button>
    </section>

    <button class="card" aria-label="Lihat rincian iuran">
      <span class="t">
        <span class="l">Iuran yang belum dibayar</span>
        <b>Rp 10.000</b>
        <span class="s">Ketuk untuk melihat rincian</span>
      </span>
      <i class="go" data-lucide="chevron-right"></i>
    </button>

    <div class="grid">
      <button class="tile h-amber"><span class="new">2 baru</span><span class="ico"><i data-lucide="megaphone"></i></span><b>Info dan Pengumuman</b><span class="s">Riwayat kabar pengurus</span><span class="go"><i data-lucide="chevron-right"></i></span></button>
      <button class="tile h-blue"><span class="ico"><i data-lucide="shield-check"></i></span><b>Jadwal Ronda</b><span class="s">Giliran jaga malam</span><span class="go"><i data-lucide="chevron-right"></i></span></button>
      <button class="tile h-purple"><span class="ico"><i data-lucide="clipboard-list"></i></span><b>Program RT</b><span class="s">Kegiatan dan rencana RT</span><span class="go"><i data-lucide="chevron-right"></i></span></button>
      <button class="tile h-pink"><span class="ico"><i data-lucide="images"></i></span><b>Galeri RT</b><span class="s">Foto kegiatan warga</span><span class="go"><i data-lucide="chevron-right"></i></span></button>
      <button class="tile h-indigo"><span class="ico"><i data-lucide="network"></i></span><b>Struktur Pengurus</b><span class="s">Ketua, sekretaris, bendahara</span><span class="go"><i data-lucide="chevron-right"></i></span></button>
      <button class="tile h-wa"><span class="ico"><i data-lucide="message-circle"></i></span><b>Butuh bantuan?</b><span class="s">Hubungi via WhatsApp</span><span class="go"><i data-lucide="chevron-right"></i></span></button>
    </div>
  </div>
</main>

<nav aria-label="Navigasi utama">
  <button class="on"><span class="ni"><i data-lucide="house"></i></span>Beranda</button>
  <button><span class="ni"><i data-lucide="users"></i></span>Warga</button>
  <button><span class="ni"><i data-lucide="wallet"></i></span>Keuangan</button>
  <button><span class="ni"><i data-lucide="user-round"></i></span>Profil</button>
</nav>
<script>try{lucide.createIcons()}catch(e){}
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on')});b.classList.add('on')})});</script>
</body>
</html>
