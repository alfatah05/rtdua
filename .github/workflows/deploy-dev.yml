name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, curl, openssl, gd
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Composer install (backend)
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: NPM install & build (frontend)
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Syntax check PHP
        run: find backend/app -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Deploy via FTP (placeholder)
        # Ganti dengan FTP-Deploy-Action setelah Secrets diisi
        # uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        # with:
        #   server: ${{ secrets.FTP_SERVER }}
        #   username: ${{ secrets.FTP_USERNAME }}
        #   password: ${{ secrets.FTP_PASSWORD }}
        #   local-dir: ./
        #   server-dir: /  # sesuaikan
        run: echo "Deploy step siap. Isi GitHub Secrets FTP_* lalu aktifkan action di atas."
EOF