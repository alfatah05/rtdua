name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, curl, openssl, gd
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Composer install (backend)
        working-directory: backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs || true
          # pastikan public/index.php dari framework ada
          if [ ! -f public/index.php ] || grep -q "Placeholder" public/index.php 2>/dev/null; then
            if [ -f vendor/codeigniter4/framework/public/index.php ]; then
              cp vendor/codeigniter4/framework/public/index.php public/index.php
            fi
          fi

      - name: NPM install & build (frontend)
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Syntax check PHP
        run: find backend -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l || true

      - name: Prepare deploy folders
        run: |
          mkdir -p deploy-out/warga deploy-out/pengurus deploy-out/rt-app
          # Frontend builds
          if [ -d frontend/dist/warga ]; then cp -a frontend/dist/warga/. deploy-out/warga/; fi
          if [ -d frontend/dist/pengurus ]; then cp -a frontend/dist/pengurus/. deploy-out/pengurus/; fi
          # Thin proxy + htaccess
          mkdir -p deploy-out/warga/api deploy-out/pengurus/api
          cp deploy/warga/api/index.php deploy-out/warga/api/
          cp deploy/pengurus/api/index.php deploy-out/pengurus/api/
          cp deploy/warga/.htaccess deploy-out/warga/
          cp deploy/pengurus/.htaccess deploy-out/pengurus/
          # Backend (tanpa writable isi, tanpa .env)
          cp -a backend/app backend/public backend/composer.json backend/spark deploy-out/rt-app/ 2>/dev/null || true
          if [ -d backend/vendor ]; then cp -a backend/vendor deploy-out/rt-app/; fi
          # writable kosong + index.html
          mkdir -p deploy-out/rt-app/writable/{cache,logs,session,uploads}
          touch deploy-out/rt-app/writable/cache/index.html
          touch deploy-out/rt-app/writable/logs/index.html
          touch deploy-out/rt-app/writable/session/index.html
          touch deploy-out/rt-app/writable/uploads/index.html

      - name: Deploy warga-dev via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-out/warga/
          server-dir: /public_html/aa_sub_domain/warga-dev.rtdua.my.id/
          dangerous-clean-slate: false

      - name: Deploy pengurus-dev via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-out/pengurus/
          server-dir: /public_html/aa_sub_domain/pengurus-dev.rtdua.my.id/
          dangerous-clean-slate: false

      - name: Deploy backend (rt-app) via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-out/rt-app/
          server-dir: /rt-app/
          dangerous-clean-slate: false
