name: Deploy Dev

# Manual only → domain DEV + backend DEV
#
# Deploy via SSH/SFTP (rsync). Secrets:
#   VPS_SSH_KEY
#   FTP_SERVER, FTP_USERNAME
#   FTP_SERVER_DIR_WARGA, FTP_SERVER_DIR_PENGURUS, FTP_SERVER_DIR_BACKEND_DEV
# Opsional: FTP_PORT (default 22)

on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, curl, openssl, gd
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Composer install (backend)
        working-directory: backend
        run: |
          set -e
          composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

          if [ -f vendor/codeigniter4/framework/public/index.php ]; then
            cp vendor/codeigniter4/framework/public/index.php public/index.php
          fi

          CFG_SRC="vendor/codeigniter4/framework/app/Config"
          CFG_DST="app/Config"
          mkdir -p "$CFG_DST/Boot"
          if [ -d "$CFG_SRC" ]; then
            for f in "$CFG_SRC"/*.php; do
              base=$(basename "$f")
              case "$base" in
                App.php|Filters.php|Routes.php|Session.php|Paths.php) continue ;;
              esac
              if [ ! -f "$CFG_DST/$base" ]; then cp "$f" "$CFG_DST/$base"; fi
            done
            for f in "$CFG_SRC/Boot"/*.php; do
              base=$(basename "$f")
              if [ ! -f "$CFG_DST/Boot/$base" ]; then cp "$f" "$CFG_DST/Boot/$base"; fi
            done
          fi

          if [ ! -f app/Config/Paths.php ]; then
            echo "Paths.php hilang" >&2
            exit 1
          fi
          grep -q 'vendor/codeigniter4/framework/system' app/Config/Paths.php

      - name: NPM build
        run: |
          set -e
          mkdir -p frontend/public/icons
          cd frontend
          npm install
          npm run build

      - name: Siapkan paket deploy DEV
        run: |
          set -e
          mkdir -p dist/warga dist/pengurus dist/rt-app

          cp -a frontend/dist/warga/. dist/warga/
          cp -a frontend/dist/pengurus/. dist/pengurus/

          BUILD_ID=$(date -u +%Y%m%d%H%M%S)
          echo "<!-- rtdua-build-dev ${BUILD_ID} -->" >> dist/warga/index.html
          echo "<!-- rtdua-build-dev ${BUILD_ID} -->" >> dist/pengurus/index.html
          echo "BUILD_ID=${BUILD_ID}"

          # .htaccess + api proxy → backend DEV (rt-app-dev)
          cp deploy/warga/.htaccess dist/warga/
          mkdir -p dist/warga/api
          sed 's/rt-app/rt-app-dev/g' deploy/warga/api/index.php > dist/warga/api/index.php
          grep -q 'rt-app-dev' dist/warga/api/index.php

          cp deploy/pengurus/.htaccess dist/pengurus/
          mkdir -p dist/pengurus/api
          sed 's/rt-app/rt-app-dev/g' deploy/pengurus/api/index.php > dist/pengurus/api/index.php
          grep -q 'rt-app-dev' dist/pengurus/api/index.php

          rsync -a \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='tests' \
            --exclude='writable/logs/*' \
            --exclude='writable/cache/*' \
            --exclude='writable/session/*' \
            --exclude='writable/uploads/*' \
            backend/ dist/rt-app/

          mkdir -p dist/rt-app/writable/{cache,logs,session,uploads}
          touch dist/rt-app/writable/cache/.gitkeep dist/rt-app/writable/logs/.gitkeep
          touch dist/rt-app/writable/session/.gitkeep dist/rt-app/writable/uploads/.gitkeep

          echo "=== paket deploy DEV ==="
          du -sh dist/warga dist/pengurus dist/rt-app
          test -f dist/rt-app/vendor/codeigniter4/framework/system/Boot.php

      - name: Setup SSH key (VPS_SSH_KEY)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "Secret VPS_SSH_KEY kosong" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE="$HOME/.ssh/id_deploy"
          printenv VPS_SSH_KEY > "$KEY_FILE"
          sed -i 's/\r$//' "$KEY_FILE"
          if [ -n "$(tail -c1 "$KEY_FILE")" ]; then printf '\n' >> "$KEY_FILE"; fi
          chmod 600 "$KEY_FILE"
          PORT="${SFTP_PORT:-22}"
          if [ -n "${SFTP_HOST}" ]; then
            ssh-keyscan -p "$PORT" -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            chmod 644 ~/.ssh/known_hosts
          fi
          ssh-keygen -y -f "$KEY_FILE" >/dev/null
          echo "SSH key siap"

      - name: Deploy WARGA-DEV (SFTP)
        id: ftp_warga
        continue-on-error: true
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
          SFTP_DIR: ${{ secrets.FTP_SERVER_DIR_WARGA }}
        run: |
          set -euo pipefail
          PORT="${SFTP_PORT:-22}"
          if [ -z "${SFTP_HOST}" ] || [ -z "${SFTP_USER}" ] || [ -z "${SFTP_DIR}" ]; then
            echo "Secret tidak lengkap (FTP_SERVER / FTP_USERNAME / path dir)" >&2
            exit 1
          fi
          REMOTE_DIR="${SFTP_DIR}"
          case "$REMOTE_DIR" in
            */) ;;
            *) REMOTE_DIR="${REMOTE_DIR}/" ;;
          esac
          rsync -az --info=stats2 --delete --exclude='.git' --exclude='.git*' --exclude='node_modules' --exclude='node_modules/***' \
            -e "ssh -i $HOME/.ssh/id_deploy -p $PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "./dist/warga/" "${SFTP_USER}@${SFTP_HOST}:${REMOTE_DIR}"

      - name: Deploy PENGURUS-DEV (SFTP)
        id: ftp_pengurus
        continue-on-error: true
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
          SFTP_DIR: ${{ secrets.FTP_SERVER_DIR_PENGURUS }}
        run: |
          set -euo pipefail
          PORT="${SFTP_PORT:-22}"
          if [ -z "${SFTP_HOST}" ] || [ -z "${SFTP_USER}" ] || [ -z "${SFTP_DIR}" ]; then
            echo "Secret tidak lengkap (FTP_SERVER / FTP_USERNAME / path dir)" >&2
            exit 1
          fi
          REMOTE_DIR="${SFTP_DIR}"
          case "$REMOTE_DIR" in
            */) ;;
            *) REMOTE_DIR="${REMOTE_DIR}/" ;;
          esac
          rsync -az --info=stats2 --delete --exclude='.git' --exclude='.git*' --exclude='node_modules' --exclude='node_modules/***' \
            -e "ssh -i $HOME/.ssh/id_deploy -p $PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "./dist/pengurus/" "${SFTP_USER}@${SFTP_HOST}:${REMOTE_DIR}"

      - name: Deploy BACKEND rt-app-dev (SFTP)
        id: ftp_backend
        continue-on-error: true
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
          SFTP_DIR: ${{ secrets.FTP_SERVER_DIR_BACKEND_DEV }}
        run: |
          set -euo pipefail
          PORT="${SFTP_PORT:-22}"
          if [ -z "${SFTP_HOST}" ] || [ -z "${SFTP_USER}" ] || [ -z "${SFTP_DIR}" ]; then
            echo "Secret tidak lengkap (FTP_SERVER / FTP_USERNAME / path dir)" >&2
            exit 1
          fi
          REMOTE_DIR="${SFTP_DIR}"
          case "$REMOTE_DIR" in
            */) ;;
            *) REMOTE_DIR="${REMOTE_DIR}/" ;;
          esac
          rsync -az --info=stats2 --exclude='.git' --exclude='.git*' --exclude='node_modules' --exclude='node_modules/***' --exclude='tests' --exclude='tests/***' --exclude='writable/logs/***' --exclude='writable/cache/***' --exclude='writable/session/***' --exclude='writable/uploads/***' --exclude='.env' \
            -e "ssh -i $HOME/.ssh/id_deploy -p $PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            "./dist/rt-app/" "${SFTP_USER}@${SFTP_HOST}:${REMOTE_DIR}"

      - name: Zip cadangan
        if: always()
        run: |
          set -e
          mkdir -p artifacts
          (cd dist && zip -r -q "../artifacts/warga-dev.zip" warga)
          if [ "${{ steps.ftp_pengurus.outcome }}" = "failure" ]; then
            (cd dist && zip -r -q "../artifacts/pengurus-dev.zip" pengurus)
          fi
          if [ "${{ steps.ftp_backend.outcome }}" = "failure" ]; then
            (cd dist && zip -r -q "../artifacts/rt-app-dev.zip" rt-app)
          fi
          ls -lh artifacts/ || true

      - name: Upload artifact warga-dev
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warga-dev
          path: artifacts/warga-dev.zip
          retention-days: 3

      - name: Upload artifact pengurus-dev
        if: steps.ftp_pengurus.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pengurus-dev
          path: artifacts/pengurus-dev.zip
          retention-days: 3

      - name: Upload artifact rt-app-dev
        if: steps.ftp_backend.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rt-app-dev
          path: artifacts/rt-app-dev.zip
          retention-days: 3

      - name: Ringkasan Deploy Dev
        if: always()
        run: |
          echo "=== DEPLOY DEV ==="
          echo "Warga → FTP_SERVER_DIR_WARGA:           ${{ steps.ftp_warga.outcome }}"
          echo "Pengurus → FTP_SERVER_DIR_PENGURUS:     ${{ steps.ftp_pengurus.outcome }}"
          echo "Backend → FTP_SERVER_DIR_BACKEND_DEV:   ${{ steps.ftp_backend.outcome }}"
          echo "Proxy API → rt-app-dev"
