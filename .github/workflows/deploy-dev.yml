name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, curl, openssl, gd
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Composer install (backend)
        working-directory: backend
        run: |
          set -e
          composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

          if [ -f vendor/codeigniter4/framework/public/index.php ]; then
            cp vendor/codeigniter4/framework/public/index.php public/index.php
          fi

          CFG_SRC="vendor/codeigniter4/framework/app/Config"
          CFG_DST="app/Config"
          mkdir -p "$CFG_DST/Boot"
          if [ -d "$CFG_SRC" ]; then
            for f in "$CFG_SRC"/*.php; do
              base=$(basename "$f")
              case "$base" in
                App.php|Filters.php|Routes.php|Session.php|Paths.php) continue ;;
              esac
              if [ ! -f "$CFG_DST/$base" ]; then cp "$f" "$CFG_DST/$base"; fi
            done
            for f in "$CFG_SRC/Boot"/*.php; do
              base=$(basename "$f")
              if [ ! -f "$CFG_DST/Boot/$base" ]; then cp "$f" "$CFG_DST/Boot/$base"; fi
            done
          fi

          if [ ! -f app/Config/Paths.php ]; then
            echo "Paths.php hilang" >&2
            exit 1
          fi
          grep -q 'vendor/codeigniter4/framework/system' app/Config/Paths.php

          echo "=== public/index.php ==="
          head -8 public/index.php
          echo "=== Paths systemDirectory ==="
          grep systemDirectory app/Config/Paths.php
          echo "=== app/Config ==="
          ls app/Config/ | head -40
          ls app/Config/Boot/ 2>/dev/null || true

      - name: NPM install & build (frontend)
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Siapkan paket deploy
        run: |
          set -e
          mkdir -p dist/warga dist/pengurus dist/rt-app

          cp -a frontend/dist/warga/. dist/warga/
          cp -a frontend/dist/pengurus/. dist/pengurus/

          cp deploy/warga/.htaccess dist/warga/
          mkdir -p dist/warga/api && cp deploy/warga/api/index.php dist/warga/api/
          cp deploy/pengurus/.htaccess dist/pengurus/
          mkdir -p dist/pengurus/api && cp deploy/pengurus/api/index.php dist/pengurus/api/

          rsync -a \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='tests' \
            --exclude='writable/logs/*' \
            --exclude='writable/cache/*' \
            --exclude='writable/session/*' \
            --exclude='writable/uploads/*' \
            backend/ dist/rt-app/

          mkdir -p dist/rt-app/writable/{cache,logs,session,uploads}
          touch dist/rt-app/writable/cache/.gitkeep dist/rt-app/writable/logs/.gitkeep
          touch dist/rt-app/writable/session/.gitkeep dist/rt-app/writable/uploads/.gitkeep

          echo "=== paket deploy ==="
          du -sh dist/warga dist/pengurus dist/rt-app
          test -f dist/rt-app/app/Config/Database.php
          test -f dist/rt-app/app/Config/Services.php
          test -f dist/rt-app/app/Config/Paths.php
          test -f dist/rt-app/app/Config/Boot/development.php
          test -f dist/rt-app/vendor/codeigniter4/framework/system/Boot.php

      # FTP: timeout panjang + security loose (shared hosting sering butuh ini)
      # Jangan jalanin banyak deploy bersamaan — concurrency sudah cancel-in-progress
      - name: Deploy WARGA-DEV (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/warga/
          server-dir: ${{ secrets.FTP_SERVER_DIR_WARGA }}
          dangerous-clean-slate: false
          timeout: 600000
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy PENGURUS-DEV (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/pengurus/
          server-dir: ${{ secrets.FTP_SERVER_DIR_PENGURUS }}
          dangerous-clean-slate: false
          timeout: 600000
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy BACKEND rt-app (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/rt-app/
          server-dir: ${{ secrets.FTP_SERVER_DIR_BACKEND }}
          dangerous-clean-slate: false
          timeout: 600000
          security: loose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/writable/logs/**
            **/writable/cache/**
            **/writable/session/**
            **/writable/uploads/**
